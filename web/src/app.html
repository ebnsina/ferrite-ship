<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#bede4f" />
		<!-- Marketing is dark and the dashboard light, so the browser chrome
		     follows the reader's scheme rather than one fixed colour. -->
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191a17" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfa" />
		<meta name="color-scheme" content="dark light" />
		<script>
			// Applied before first paint so a stored theme never flashes.
			try {
				const stored = localStorage.getItem('ferrite-theme');
				if (stored === 'light' || stored === 'dark') {
					document.documentElement.dataset.theme = stored;
				}
			} catch {
				// Storage unavailable (private mode, blocked cookies) — keep the default.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
